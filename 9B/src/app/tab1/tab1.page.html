<!-- =====================================================================
     TAB 1 · INICIO
     {{ variable }} = interpolación: muestra el valor de una variable del .ts
     usuario?.nombre = el "?" evita un error si usuario todavía es null
     ===================================================================== -->
<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Inicio</ion-title>
    <ion-buttons slot="end">
      <!-- (click) conecta el botón con cerrarSesion() de tab1.page.ts -->
      <ion-button (click)="cerrarSesion()">
        <ion-icon slot="icon-only" name="log-out-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">

  <!-- Saludo con el nombre del usuario que inició sesión -->
  <div class="saludo">
    <ion-icon name="person-circle-outline"></ion-icon>
    <p>Hola de nuevo</p>
    <h1>{{ usuario?.nombre }} {{ usuario?.apellidos }}</h1>
  </div>

  <!-- Datos del objeto usuario (vienen de login.php y se guardaron en la sesión) -->
  <ion-card>
    <ion-card-header>
      <ion-card-subtitle>Tu cuenta</ion-card-subtitle>
      <ion-card-title>Datos de sesión</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-list lines="none">
        <ion-item>
          <ion-icon name="mail-outline" slot="start"></ion-icon>
          <ion-label>{{ usuario?.email }}</ion-label>
        </ion-item>
        <ion-item>
          <ion-icon name="call-outline" slot="start"></ion-icon>
          <ion-label>{{ usuario?.telefono || 'Sin teléfono' }}</ion-label>
        </ion-item>
        <ion-item>
          <ion-icon name="finger-print-outline" slot="start"></ion-icon>
          <ion-label>ID: {{ usuario?.id }}</ion-label>
        </ion-item>
      </ion-list>
    </ion-card-content>
  </ion-card>

  <!-- Total de usuarios (viene de la API con GET). Al tocarla va a la pestaña Usuarios -->
  <ion-card routerLink="/tabs/tab2" button>
    <ion-card-content class="resumen">
      <ion-icon name="people-outline"></ion-icon>
      <div>
        <h2>{{ totalUsuarios }}</h2>
        <p>Usuarios registrados</p>
      </div>
    </ion-card-content>
  </ion-card>

  <ion-button expand="block" fill="outline" (click)="cerrarSesion()">
    <ion-icon name="log-out-outline" slot="start"></ion-icon>
    Cerrar sesión
  </ion-button>

</ion-content>
